name: Gold Agent

on:
  schedule:
    - cron: "2 * * * *"        # har ghante, :02 UTC par
  workflow_dispatch:            # manual test ke liye

permissions:
  contents: read

concurrency:
  group: gold-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EQUITY_USD: "0"
        run: python agent.py
